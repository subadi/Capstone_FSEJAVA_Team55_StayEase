spring:
  application:
    name: stayease-backend
  datasource:
    url: jdbc:h2:mem:stayease;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
server:
  port: 8080
app:
  jwt:
    secret: change-this-development-secret-to-a-32-byte-minimum-secret-key
    expiration-minutes: 120
